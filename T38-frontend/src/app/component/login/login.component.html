<div class="login-container">
  <h2>Iniciar Sesión</h2>
  <form (ngSubmit)="login()">
    <div>
      <label for="username">Usuario (Email):</label>
      <input 
        type="email" 
        id="username" 
        [(ngModel)]="username" 
        name="username" 
        required 
        placeholder="admin@autolote.com"
      />
    </div>

    <div>
      <label for="password">Contraseña:</label>
      <input 
        type="password" 
        id="password" 
        [(ngModel)]="contrasenia" 
        name="password" 
        required 
        placeholder="••••••••"
      />
    </div>

    <button type="submit" [disabled]="loading">
      {{ loading ? 'Cargando...' : 'Entrar' }}
    </button>
  </form>
</div>

<div *ngIf="errorMessage" class="error-message">
  {{ errorMessage }}
</div>

<div class="login-footer" *ngIf="!errorMessage">
  <small>Usuario de prueba: admin&#64;autolote.com / 123456</small>
</div>
